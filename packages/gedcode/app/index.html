<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GedCode</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #151515; color: #f2eadf; }
      body { margin: 0; }
      main { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
      aside { border-right: 1px solid #3a332d; padding: 20px; background: #1d1b19; }
      section { padding: 24px; }
      .card { border: 1px solid #3a332d; border-radius: 12px; padding: 16px; margin-bottom: 16px; background: #211f1c; }
      .muted { color: #b8aa99; }
      code { color: #f7c873; }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>GedCode</h1>
        <p class="muted">Read-only GedPi cockpit</p>
      </aside>
      <section>
        <div class="card">
          <h2>M1 dashboard scaffold</h2>
          <p>This shell is ready for project selection and read-only <code>.ged</code> state rendering.</p>
        </div>
      </section>
    </main>
  </body>
</html>
