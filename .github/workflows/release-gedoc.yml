name: Release GedOC

on:
  push:
    tags:
      - "gedoc-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without prefix (e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME}" == gedoc-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#gedoc-v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check and sync versions
        run: npm -w packages/gedoc run check

      - name: Test
        run: npm -w packages/gedoc test

      - name: Verify version matches
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Package version ($PKG_VERSION) does not match release version (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
        working-directory: packages/gedoc

      - name: Build release bundle
        env:
          GEDOC_VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash scripts/release/bundle.sh
        working-directory: packages/gedoc

      - name: Compute SHA256SUMS
        run: |
          cd packages/gedoc/dist
          shasum -a 256 gedoc-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Copy installer scripts
        run: |
          cp packages/gedoc/install.sh packages/gedoc/dist/install.sh
          cp packages/gedoc/install.ps1 packages/gedoc/dist/install.ps1

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == gedoc-v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=gedoc-v${{ steps.version.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: |
            packages/gedoc/dist/gedoc-*.tar.gz
            packages/gedoc/dist/SHA256SUMS
            packages/gedoc/dist/install.sh
            packages/gedoc/dist/install.ps1
          generate_release_notes: true
