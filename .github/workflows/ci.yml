name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-gedpi:
    name: GedPi verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GedPi dependencies
        run: npm ci
        working-directory: packages/gedpi

      - name: Verify
        run: npm run verify
        working-directory: packages/gedpi

  verify-gedoc:
    name: GedOC check + test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type-check and sync versions
        run: npm -w packages/gedoc run check

      - name: Test
        run: npm -w packages/gedoc test
